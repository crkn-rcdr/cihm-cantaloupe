services:
  cantaloupe:
    build: .
    image: cihm-cantaloupe
    networks:
      access-platform:
        ipv4_address: 172.30.0.5
    volumes:
      - ./data:/data
    restart: unless-stopped
    environment:
      JDK_JAVA_OPTIONS: "--enable-native-access=ALL-UNNAMED"
      JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:--Xms8g -Xmx24g -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError}"
      SOURCE_STATIC: S3Source
      S3SOURCE_ENDPOINT: https://swift-tor.canadiana.ca
      S3SOURCE_ACCESSFILES_BUCKET_NAME: access-files
      IMAGE_EXTENSIONS_REDIS_URL: redis://127.0.0.1:6379/0
      IMAGE_EXTENSIONS_REDIS_HASH: image_extensions
      IMAGE_SOURCE_PATHS_REDIS_HASH: image_source_paths
      IMAGE_EXTENSIONS_REDIS_DIR: /data/redis
      IMAGE_EXTENSIONS_REDIS_PRELOAD: "true"
      IMAGE_EXTENSIONS_CACHE_SIZE: "50000"
      IMAGE_SOURCE_PATHS_CACHE_SIZE: "50000"
      IMAGE_EXTENSIONS_REDIS_POOL_SIZE: "64"
      CANTALOUPE_PURGE_ZERO_BYTE_CACHE: "true"
      S3SOURCE_PRESERVATION_BUCKET_NAME: preservation-cihm-aip
      ENDPOINT_API_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8182/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
networks:
  access-platform:
    external: true
